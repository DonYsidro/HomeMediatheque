{% extends "base.html" %}
{% block title %}{{ t('ajouter_cd') }}{% endblock %}
{% block content %}
<h1>{{ t('ajouter_cd') }}</h1>
<form method="POST" action="/cds/ajouter" enctype="multipart/form-data">
    <label>{{ t('titre_album') }} * <input type="text" name="titre" id="champ-titre" required></label>
    <button type="button" onclick="chercherMusicBrainz()">{{ t('chercher_infos') }}</button>
    <span id="statut-recherche"></span>

    <label>{{ t('artiste') }} <input type="text" name="artiste"></label>
    <label>{{ t('annee') }} <input type="number" name="annee"></label>
    <label>{{ t('nb_pistes') }} <input type="number" name="nb_pistes"></label>
    <label>{{ t('duree_minutes') }} <input type="number" name="duree_minutes"></label>
    <label>{{ t('genre') }} <input type="text" name="genre"></label>

    <label>{{ t('url_pochette') }} <input type="text" name="pochette_url" id="champ-pochette"></label>
    <button type="button" onclick="chercherPochettes()">{{ t('choisir_pochette') }}</button>
    <div id="galerie-pochettes" style="display:flex; flex-wrap:wrap; gap:10px; margin: 12px 0;"></div>

    <label>{{ t('code_barre') }} <input type="text" name="code_barre"></label>
    <label>{{ t('photo_upload') }} <input type="file" name="photo" accept="image/*" capture="environment"></label>
    <label>{{ t('lieu_stockage') }} * <input type="text" name="lieu_stockage" required></label>

    <button type="submit">{{ t('ajouter_bouton') }}</button>
</form>

<script>
async function chercherMusicBrainz() {
    const titre = document.getElementById("champ-titre").value.trim();
    const artiste = document.querySelector('[name="artiste"]').value.trim();
    const statut = document.getElementById("statut-recherche");
    if (!titre) { statut.textContent = "Saisis d'abord un titre."; return; }
    statut.textContent = "Recherche en cours...";
    try {
        const params = artiste ? `titre=${encodeURIComponent(titre)}&artiste=${encodeURIComponent(artiste)}` : `titre=${encodeURIComponent(titre)}`;
        const resp = await fetch(`/api/musicbrainz_search?${params}`);
        const data = await resp.json();
        if (!resp.ok) { statut.textContent = data.erreur || "Erreur de recherche."; return; }
        document.getElementById("champ-titre").value = data.titre || titre;
        document.querySelector('[name="artiste"]').value = data.artiste || "";
        document.querySelector('[name="annee"]').value = data.annee || "";
        document.querySelector('[name="nb_pistes"]').value = data.nb_pistes || "";
        document.querySelector('[name="duree_minutes"]').value = data.duree_minutes || "";
        document.getElementById("champ-pochette").value = data.pochette_url || "";
        statut.textContent = "✓ Infos trouvées, vérifie et complète si besoin.";
    } catch (err) {
        statut.textContent = "Erreur de connexion à l'API.";
    }
}

async function chercherPochettes() {
    const titre = document.getElementById("champ-titre").value.trim();
    const galerie = document.getElementById("galerie-pochettes");
    if (!titre) { document.getElementById("statut-recherche").textContent = "Saisis d'abord un titre."; return; }
    galerie.innerHTML = "Recherche de pochettes...";
    try {
        const resp = await fetch(`/api/musicbrainz_couvertures?titre=${encodeURIComponent(titre)}`);
        const data = await resp.json();
        if (!resp.ok) { galerie.innerHTML = data.erreur || "Aucune pochette trouvée."; return; }
        galerie.innerHTML = "";
        data.resultats.forEach(r => {
            const img = document.createElement("img");
            img.src = r.pochette_url;
            img.title = r.titre + (r.artiste ? " - " + r.artiste : "");
            img.style = "height:150px; cursor:pointer; border-radius:6px; border:2px solid var(--border);";
            img.onerror = () => { img.style.display = "none"; };
            img.onclick = () => {
                document.getElementById("champ-pochette").value = r.pochette_url;
                document.querySelectorAll("#galerie-pochettes img").forEach(el => el.style.borderColor = "var(--border)");
                img.style.borderColor = "var(--accent)";
            };
            galerie.appendChild(img);
        });
    } catch (err) {
        galerie.innerHTML = "Erreur de connexion à l'API.";
    }
}
</script>
{% endblock %}
