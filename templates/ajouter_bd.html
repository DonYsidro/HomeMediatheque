{% extends "base.html" %}
{% block title %}{{ t('ajouter_bd_titre_page') }}{% endblock %}
{% block content %}
<h1>{{ t('ajouter_bd_titre_page') }}</h1>
<form method="POST" action="/bd-mangas/ajouter" enctype="multipart/form-data">
    <label>{{ t('serie_obligatoire') }} <input type="text" name="serie" id="champ-serie" required></label>
    <label>{{ t('titre_du_tome') }} <input type="text" name="titre" id="champ-titre"></label>
    <label>{{ t('isbn') }} <input type="text" name="isbn" id="champ-isbn"></label>
    <button type="button" onclick="chercherGoogleBooks()">{{ t('chercher_infos') }}</button>
    <button type="button" onclick="demarrerScanner()">{{ t('scanner_code_barre') }}</button>
    <span id="statut-recherche"></span>

    <div id="zone-scanner" style="display:none; max-width: 400px; margin: 12px 0;"></div>

    <label>{{ t('type_champ') }} *
        <select name="type" required>
            <option value="bd">{{ t('type_bd') }}</option>
            <option value="manga">{{ t('type_manga') }}</option>
        </select>
    </label>

    <label>{{ t('numero_tome') }} <input type="number" name="numero_tome"></label>
    <label>{{ t('nb_tomes_serie') }} <input type="number" name="nb_tomes_serie"></label>
    <label>{{ t('auteur') }} <input type="text" name="auteur"></label>
    <label>{{ t('annee') }} <input type="number" name="annee"></label>
    <label>{{ t('editeur') }} <input type="text" name="editeur"></label>
    <label>{{ t('langue_champ') }} <input type="text" name="langue" placeholder="fr, en, ja (VO)..."></label>
    <label>{{ t('synopsis') }} <textarea name="synopsis"></textarea></label>

    <label>{{ t('url_couverture') }} <input type="text" name="couverture_url" id="champ-couverture"></label>
    <button type="button" onclick="chercherCouvertures()">{{ t('choisir_couverture') }}</button>
    <div id="galerie-couvertures" style="display:flex; flex-wrap:wrap; gap:10px; margin: 12px 0;"></div>

    <label>{{ t('photo_upload') }} <input type="file" name="photo" accept="image/*" capture="environment"></label>
    <label>{{ t('lieu_stockage') }} * <input type="text" name="lieu_stockage" required></label>

    <button type="submit">{{ t('ajouter_bouton') }}</button>
</form>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
async function chercherGoogleBooks() {
    const titre = document.getElementById("champ-titre").value.trim() || document.getElementById("champ-serie").value.trim();
    const isbn = document.getElementById("champ-isbn").value.trim();
    const statut = document.getElementById("statut-recherche");
    if (!titre && !isbn) { statut.textContent = "Saisis un titre/série ou un ISBN."; return; }
    statut.textContent = "Recherche en cours...";
    try {
        const params = isbn ? `isbn=${encodeURIComponent(isbn)}` : `titre=${encodeURIComponent(titre)}`;
        const resp = await fetch(`/api/googlebooks_search?${params}`);
        const data = await resp.json();
        if (!resp.ok) { statut.textContent = data.erreur || "Erreur de recherche."; return; }
        document.getElementById("champ-titre").value = data.titre || titre;
        document.getElementById("champ-isbn").value = data.isbn || isbn;
        document.querySelector('[name="auteur"]').value = data.auteur || "";
        document.querySelector('[name="annee"]').value = data.annee || "";
        document.querySelector('[name="editeur"]').value = data.editeur || "";
        document.querySelector('[name="langue"]').value = data.langue || "";
        document.querySelector('[name="synopsis"]').value = data.synopsis || "";
        document.getElementById("champ-couverture").value = data.couverture_url || "";
        statut.textContent = "✓ Infos trouvées, vérifie et complète si besoin.";
    } catch (err) {
        statut.textContent = "Erreur de connexion à l'API.";
    }
}

async function chercherCouvertures() {
    const titre = document.getElementById("champ-titre").value.trim() || document.getElementById("champ-serie").value.trim();
    const galerie = document.getElementById("galerie-couvertures");
    if (!titre) { document.getElementById("statut-recherche").textContent = "Saisis d'abord un titre ou une série."; return; }
    galerie.innerHTML = "Recherche de couvertures...";
    try {
        const resp = await fetch(`/api/googlebooks_couvertures?titre=${encodeURIComponent(titre)}`);
        const data = await resp.json();
        if (!resp.ok) { galerie.innerHTML = data.erreur || "Aucune couverture trouvée."; return; }
        galerie.innerHTML = "";
        data.resultats.forEach(r => {
            const img = document.createElement("img");
            img.src = r.couverture_url;
            img.title = r.titre + (r.auteur ? " - " + r.auteur : "");
            img.style = "height:120px; cursor:pointer; border-radius:6px; border:2px solid var(--border);";
            img.onclick = () => {
                document.getElementById("champ-couverture").value = r.couverture_url;
                document.querySelectorAll("#galerie-couvertures img").forEach(el => el.style.borderColor = "var(--border)");
                img.style.borderColor = "var(--accent)";
            };
            galerie.appendChild(img);
        });
    } catch (err) {
        galerie.innerHTML = "Erreur de connexion à l'API.";
    }
}

let scannerActif = null;
function demarrerScanner() {
    const zone = document.getElementById("zone-scanner");
    zone.style.display = "block";
    zone.innerHTML = '<div id="lecteur-scan"></div>';
    scannerActif = new Html5Qrcode("lecteur-scan", {
        formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8]
    });
    scannerActif.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 100 } },
        (codeDetecte) => {
            document.getElementById("champ-isbn").value = codeDetecte;
            arreterScanner();
            chercherGoogleBooks();
        },
        () => {}
    ).catch((err) => {
        document.getElementById("statut-recherche").textContent = "Impossible d'accéder à la caméra : " + err;
    });
}
function arreterScanner() {
    if (scannerActif) {
        scannerActif.stop().then(() => {
            document.getElementById("zone-scanner").style.display = "none";
        });
    }
}
</script>
{% endblock %}
